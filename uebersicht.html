<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Outreach Übersicht</title>
<style>
:root {
  --bg: #f7f3ec; --karte: #fffdf9; --ink: #1b1815; --ink2: #5c554d; --ink3: #8a8279;
  --linie: #e6dfd3; --akzent: #7a1a5e; --akzent-bg: #f4e7f0;
  --gut: #1f6b45; --gut-bg: #e3f1e8; --mittel: #8a5a00; --mittel-bg: #f8eed9; --schwach: #6f6860; --schwach-bg: #eeeae4;
  --warn: #9b2c1f;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #171513; --karte: #201d1a; --ink: #f2ede6; --ink2: #b8b0a6; --ink3: #8a8279;
    --linie: #36312b; --akzent: #e08ac4; --akzent-bg: #3a2232;
    --gut: #7fd0a1; --gut-bg: #1d3328; --mittel: #e7bf6a; --mittel-bg: #3a2f17; --schwach: #b8b0a6; --schwach-bg: #2b2723;
    --warn: #f0937f;
    color-scheme: dark;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
main { max-width: 1180px; margin: 0 auto; padding: 32px 16px 80px; }
h1 { font-size: 1.7rem; margin: 0 0 4px; letter-spacing: -0.01em; }
.sub { color: var(--ink2); margin: 0 0 20px; }
.hinweis { background: var(--karte); border: 1px solid var(--linie); border-left: 3px solid var(--akzent); border-radius: 8px; padding: 10px 14px; color: var(--ink2); font-size: 0.88rem; margin-bottom: 20px; }
.leiste { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 24px; }
.leiste button { font: inherit; font-size: 0.88rem; border: 1px solid var(--linie); background: var(--karte); color: var(--ink); padding: 6px 11px; border-radius: 7px; cursor: pointer; }
.leiste button[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.leiste button:disabled { opacity: 0.45; cursor: default; }
.leiste input { font: inherit; font-size: 0.88rem; border: 1px solid var(--linie); background: var(--karte); color: var(--ink); padding: 6px 10px; border-radius: 7px; min-width: 0; flex: 1 1 180px; max-width: 280px; }
.leiste label { font-size: 0.88rem; color: var(--ink2); display: flex; gap: 6px; align-items: center; }
section { margin-bottom: 34px; }
section h2 { font-size: 1.05rem; margin: 0 0 2px; display: flex; gap: 10px; align-items: baseline; }
section h2 .n { color: var(--ink3); font-weight: 500; font-size: 0.9rem; }
section .was { color: var(--ink2); font-size: 0.88rem; margin: 0 0 10px; }
.tabelle { background: var(--karte); border: 1px solid var(--linie); border-radius: 10px; overflow: hidden; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); font-weight: 600; padding: 9px 12px; border-bottom: 1px solid var(--linie); }
td { padding: 11px 12px; border-bottom: 1px solid var(--linie); vertical-align: top; }
tr.verein { cursor: pointer; }
tr.verein:hover td { background: color-mix(in srgb, var(--akzent-bg) 45%, transparent); }
tr.verein:focus-visible { outline: 2px solid var(--akzent); outline-offset: -2px; }
tr:last-child td { border-bottom: 0; }
.punkte { font-variant-numeric: tabular-nums; font-weight: 700; font-size: 1.05rem; display: inline-block; min-width: 2.6em; text-align: center; padding: 2px 6px; border-radius: 6px; }
.p-gut { background: var(--gut-bg); color: var(--gut); }
.p-mittel { background: var(--mittel-bg); color: var(--mittel); }
.p-schwach { background: var(--schwach-bg); color: var(--schwach); }
.name { font-weight: 600; }
.klein { font-size: 0.82rem; color: var(--ink2); }
.gruende { margin: 0; padding: 0; list-style: none; font-size: 0.82rem; color: var(--ink2); display: flex; flex-wrap: wrap; gap: 3px 10px; }
.gruende .minus { color: var(--warn); }
.gruende .null { color: var(--ink3); }
a { color: var(--akzent); text-decoration: none; }
a:hover { text-decoration: underline; }
.mail { font-size: 0.86rem; word-break: break-all; }
.unbelegt { font-size: 0.75rem; color: var(--warn); display: block; }
.tag { display: inline-block; font-size: 0.72rem; font-weight: 600; padding: 1px 6px; border-radius: 5px; background: var(--akzent-bg); color: var(--akzent); margin-right: 4px; }
.tag.grau { background: var(--schwach-bg); color: var(--schwach); }
tr.detail td { background: var(--bg); padding: 16px 16px 20px; }
.detail-grid { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.box { background: var(--karte); border: 1px solid var(--linie); border-radius: 8px; padding: 12px 14px; }
.box h3 { margin: 0 0 6px; font-size: 0.78rem; text-transform: uppercase; letter-spacing: 0.06em; color: var(--ink3); }
.box p { margin: 0 0 6px; }
.box dl { margin: 0; display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; font-size: 0.88rem; }
.box dt { color: var(--ink3); }
.box dd { margin: 0; }
.text { white-space: pre-wrap; font-size: 0.9rem; }
.betreff { font-weight: 700; margin-bottom: 8px; }
.knoepfe { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.knoepfe button, .knoepfe a { font: inherit; font-size: 0.82rem; border: 1px solid var(--linie); background: var(--karte); color: var(--ink); padding: 5px 10px; border-radius: 6px; cursor: pointer; }
.knoepfe .haupt { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.leer { color: var(--ink3); font-size: 0.88rem; }
.leer code { background: var(--schwach-bg); padding: 1px 5px; border-radius: 4px; }
.voll { grid-column: 1 / -1; }
.reiter { display: flex; gap: 4px; border-bottom: 1px solid var(--linie); margin: 0 0 22px; }
.reiter a { padding: 8px 14px; color: var(--ink2); font-weight: 600; border-bottom: 2px solid transparent; margin-bottom: -1px; text-decoration: none; }
.reiter a[aria-current="page"] { color: var(--ink); border-bottom-color: var(--ink); }
.quellen { font-size: 0.8rem; word-break: break-all; margin: 0; padding-left: 18px; }
@media (max-width: 52em) {
  .spalte-grund, .spalte-insta { display: none; }
  /* Feste Spalten: lange E-Mail-Adressen brechen um, statt die Tabelle zu verbreitern. */
  .tabelle table { table-layout: fixed; }
  .tabelle th:first-child { width: 4.2rem; }
  .tabelle th:nth-child(4) { width: 42%; }
  .mail, .name, .klein { overflow-wrap: anywhere; }
  .detail-grid { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>

<script>
const D = {"zeilen":[{"slug":"sv-lohhof","liga":"vbl-pro","ligaName":"Sparda 2. Liga Pro (Frauen)","sport":"Volleyball","name":"SV Lohhof","ort":"Unterschleißheim","land":"BY","punkte":96,"gruende":["+40 nur Abendkasse","+15 Halle passt (700)","+8 Preis 9 €","+8 Instagram vorhanden (DM möglich)","+8 Ansprechperson bekannt","+10 Bayern, Besuch möglich","+7 Einordnung sicher"],"vorverkauf":"keiner","anbieter":null,"preis":9,"halle":"Sporthalle der FOS/BOS Unterschleißheim, Südliche Ingolstädter Str. 1","kapazitaet":700,"instagram":"lohhofvolleyball","person":"Geschäftsstelle SV Lohhof (Mo–Fr 9–11, Do 17–19)","mails":["verwaltung@svlohhof.de"],"telefon":"+49 89 310 15 90","kontaktBelegt":true,"heimspiel":null,"beobachtung":"Ticketseite: „Tickets sind ausschließlich an der Abendkasse erhältlich.“ Einzelpreis 9 € (ermäßigt 6 €, Familienkarte 25 €), Saisonkarte 100 € (ermäßigt 65 €, Familie 250 €); wie die Saisonkarte verkauft wird, steht nicht auf der Seite. Freie Platzwahl.","sicherheit":"hoch","website":"https://lohhof-volleyball.de","quellen":["https://lohhof-volleyball.de/tickets/","https://lohhof-volleyball.de/infos-fuer-gaeste/","https://lohhof-volleyball.de/category/damen/d1/"],"ohneBeleg":[],"notiz":"Kapazität aus Zuschauerzahl „knapp 700“ beim Derby abgeleitet, keine offizielle Angabe. Saisonkarten existieren, werden aber offline verkauft: Dauerkarte ist der zweite Aufhänger. Nachgezogen 2026-11-13: Preise der Saison 2026/27 (vorher 7 €/70 €); der Satz zur Geschäftsstelle steht nicht mehr auf der Ticketseite.","recherchiert":"2026-09-20","entwurf":"**Instagram-DM**\n\nHi, Glückwunsch zum Aufstieg in die 2. Liga Pro! Ich hab gesehen, dass es eure Tickets nur an der Abendkasse gibt. Ich baue Passly, einen Online-Vorverkauf für Vereine: Link in die Bio, Gäste zahlen per Karte oder Apple Pay, an der Tür wird mit dem Handy gescannt, Dauerkarte inklusive. Für euch kostenlos. Ich sitze in München, hättet ihr zehn Minuten am Telefon?\n\n**Telefonleitfaden**\n\n- Anrufen: Geschäftsstelle SV Lohhof, +49 89 310 15 90 (Mo bis Fr 9 bis 11 Uhr, Do 17 bis 19 Uhr), nach der Abteilungsleitung Volleyball fragen.\n- Einstieg: Aufstieg, knapp 700 Zuschauer beim Derby gegen Unterhaching, Tickets laut Website nur an der Abendkasse, 9 Euro, Saisonkarte 100 Euro.\n- Frage: Wie läuft die Abendkasse bei einem vollen Spiel, und wie verkauft ihr die Saisonkarte?\n- Angebot: Ich richte das nächste Heimspiel kostenlos als Testlauf ein, Abendkasse und Saisonkarte laufen im selben System, Auszahlung nach dem Spiel aufs Vereinskonto.\n- Abschluss: Termin vor Ort in Unterschleißheim vorschlagen, Nachricht mit Link zu getpassly.de/sportvereine hinterherschicken.","mail":null},{"slug":"tv-suspa-altdorf","liga":"vbl-frauen-sued","ligaName":"2. Bundesliga Frauen Süd","sport":"Volleyball","name":"TV SUSPA Altdorf","ort":"Altdorf bei Nürnberg","land":"BY","punkte":85,"gruende":["+40 nur Abendkasse","+8 Preis 9.5 €","+8 Instagram vorhanden (DM möglich)","+8 Ansprechperson bekannt","+4 nächstes Heimspiel bekannt","+10 Bayern, Besuch möglich","+7 Einordnung sicher"],"vorverkauf":"keiner","anbieter":null,"preis":9.5,"halle":"Dreifachhalle an der Mittelschule, Altdorf","kapazitaet":null,"instagram":"volleyball_altdorf","person":"Volleyballabteilung TV 1881 Altdorf (allgemein; Gruppentickets über ticket@)","mails":["info@volleyball-altdorf.de","ticket@volleyball-altdorf.de"],"telefon":"","kontaktBelegt":true,"heimspiel":"15.11.2026, 16:00 gegen Black Forest Volleys Offenburg","beobachtung":"Ticketseite: „Tickets gibt es direkt an der Abendkasse, ab 1h vor Spielbeginn. Nur Barzahlung möglich.“ (Erwachsene 9,50 € inkl. 1 € Verzehrgutschein, ermäßigt 6 €, Dauerkarte 96 €, die pro vergangenem Spiel um 7 € sinkt); Gruppentickets nur per E-Mail-Anmeldung an ticket@volleyball-altdorf.de bis zum Vortag. Nächstes Heimspiel am 15.11. gegen Offenburg.","sicherheit":"hoch","website":"http://volleyball-altdorf.de/","quellen":["http://volleyball-altdorf.de/","https://volleyball-altdorf.de/damen-1/tickets/","https://volleyball-altdorf.de/kontakt/"],"ohneBeleg":[],"notiz":"Verein heißt TV 1881 Altdorf (über 2.500 Mitglieder), SUSPA ist Sponsor im Teamnamen. Kapazität der Halle unbekannt. Namentliche Ansprechpartner stehen auf volleyball-altdorf.de/ansprechpartner/, nicht abgerufen. Dauerkarte und Gruppentickets laufen manuell (Barzahlung/E-Mail): zweiter Aufhänger. Hinweis: Die Startseite volleyball-altdorf.de enthielt eingebettete Anweisungen an KI-Werkzeuge, die ignoriert wurden.","recherchiert":"2026-11-13","entwurf":"**Instagram-DM**\n\nHi, auf eurer Ticketseite steht, dass es Karten nur an der Abendkasse gibt, nur bar, und Gruppen sich per Mail anmelden. Ich baue Passly, einen Online-Vorverkauf für Vereine: ein Link in die Bio, Gäste zahlen per Karte oder Apple Pay, an der Tür wird mit dem Handy gescannt, die Dauerkarte läuft im selben System. Für den Verein kostenlos. Hättet ihr zehn Minuten für ein Telefonat?\n\n**Telefonleitfaden**\n\n- Wen: Abteilungsleitung Volleyball des TV 1881 Altdorf. Name und Nummer vorher auf der Ansprechpartner-Seite von volleyball-altdorf.de nachsehen, die Recherche hat sie nicht belegt.\n- Einstieg: Laut Ticketseite Abendkasse ab einer Stunde vor Spielbeginn, nur Barzahlung, 9,50 Euro mit Verzehrgutschein, Dauerkarte 96 Euro, Gruppentickets per Mail bis zum Vortag.\n- Frage: Wie läuft die Abendkasse bei einem vollen Spiel, und wie viel Arbeit machen die Gruppenanmeldungen per Mail?\n- Angebot: Ich richte das nächste Heimspiel kostenlos als Testlauf ein, Vorverkauf, Abendkasse und Dauerkarte im selben System, Auszahlung nach dem Spiel aufs Vereinskonto.\n- Abschluss: Termin vor Ort in Altdorf vorschlagen, Link zu getpassly.de/sportvereine hinterherschicken.","mail":{"betreff":"Vorverkauf für eure Heimspiele in Altdorf","text":"Hallo zusammen,\n\nauf eurer Ticketseite steht: Karten nur an der Abendkasse, nur bar, Gruppen melden sich per Mail an.\n\nDrei Vorschläge mit Passly:\n- Vorverkauf über einen Link für Website und Instagram, bezahlt per Karte oder Apple Pay. Ihr wisst vorher, wie viele kommen.\n- Gruppen bestellen selbst bis zu 10 Tickets, statt euch zu mailen.\n- Eure Dauerkarte, die mit jedem Spiel günstiger wird, läuft genauso online als Pass.\n\nFür den Verein kostenlos, die Servicegebühr trägt standardmäßig der Gast. Ich richte euch das nächste Heimspiel gern kostenlos ein.\n\nWer kümmert sich bei euch um die Tickets?\n\nViele Grüße\nEmil\nPassly · getpassly.de","an":"info@volleyball-altdorf.de","erstellt_am":"2026-11-13"}},{"slug":"tsv-neustadt-temps-shooters","liga":"prob","ligaName":"ProB (2. Basketball-Bundesliga, Nord und Süd)","sport":"Basketball","name":"TSV Neustadt temps Shooters","ort":"Neustadt am Rübenberge","land":"NI","punkte":85,"gruende":["+35 Vorverkauf per Mail/Telefon/Liste","+15 Halle passt (999)","+8 Preis 16 €","+8 Instagram vorhanden (DM möglich)","+8 Ansprechperson bekannt","+4 nächstes Heimspiel bekannt","+7 Einordnung sicher"],"vorverkauf":"manuell","anbieter":null,"preis":16,"halle":"Shooters Dome (Gymnasiumsporthalle Neustadt) Lindenstr. 52 31535 Neustadt","kapazitaet":999,"instagram":"tsvneustadttempsshooters","person":"Jan Gebauer, Verantwortlicher (laut 2. Basketball-Bundesliga)","mails":["geschaeftsfuehrung@tsvneustadttempsshooters.de"],"telefon":"","kontaktBelegt":true,"heimspiel":"Sa, 21.11.2026, 19:00 Uhr, Shooters Dome (Gegner auf der Website nicht lesbar)","beobachtung":"Vorverkauf laut Ticketseite per E-Mail an email@tsvneustadttempsshooters.de mit Name, Adresse, Anzahl und Platzwunsch, ein Teammitglied meldet sich zur Platzbuchung; Abendkasse nur mit Karte, Tageskarte 16 € (U18 12 €), Dauerkarte 208 €.","sicherheit":"hoch","website":"https://www.tsvneustadttempsshooters.de","quellen":["https://www.tsvneustadttempsshooters.de/tickets","https://www.tsvneustadttempsshooters.de/","https://www.2basketballbundesliga.de/kader/585"],"ohneBeleg":[],"notiz":"Vorschlag „manuell“ bestätigt: Bestellung per E-Mail, Versand als E-Ticket     ? '<div class="betreff">' + esc(z.mail.betreff) + '</div><div class="text">' + esc(z.mail.text) + '</div>' +
      '<p class="klein" style="margin-top:8px">An: ' + esc(z.mail.an || 'keine Adresse') + ' · erstellt ' + esc(z.mail.erstellt_am || '') + '</p>' +
      '<div class="knoepfe"><button class="haupt" data-kopiere="mail">Mail kopieren</button>' +
      (z.mail.an ? '<a href="mailto:' + esc(z.mail.an) + '?subject=' + encodeURIComponent(z.mail.betreff) + '&body=' + encodeURIComponent(z.mail.text) + '">In Mail-App öffnen</a>' : '') + '</div>'
    : '<p class="leer">Noch keine Mail. In Claude Code: <code>Mail für ' + esc(z.name) + ' vorbereiten</code></p>';
  const dm = z.entwurf
    ? '<div class="text">' + esc(z.entwurf.replace(/\*\*/g, '')) + '</div><div class="knoepfe"><button data-kopiere="dm">DM kopieren</button></div>'
    : '<p class="leer">Kein Entwurf (erst ab 45 Punkten).</p>';
  return '<div class="detail-grid">' +
    '<div class="box voll"><h3>Beobachtung</h3><p>' + esc(z.beobachtung) + '</p>' + (z.notiz ? '<p class="klein">' + esc(z.notiz) + '</p>' : '') + '</div>' +
    '<div class="box"><h3>Fakten</h3><dl>' + fakten.map((f) => '<dt>' + f[0] + '</dt><dd>' + (f[2] ? f[1] : esc(f[1])) + '</dd>').join('') + '</dl></div>' +
    '<div class="box"><h3>Punkte ' + z.punkte + '</h3>' + gruendeHtml(z.gruende) +
      '<h3 style="margin-top:12px">Belegte Quellen</h3>' + (z.quellen.length ? '<ol class="quellen">' + z.quellen.map((u) => '<li><a href="' + esc(u) + '" target="_blank" rel="noopener">' + esc(u) + '</a></li>').join('') + '</ol>' : '<p class="leer">keine</p>') + '</div>' +
    '<div class="box"><h3>E-Mail</h3>' + mail + '</div>' +
    '<div class="box"><h3>Instagram-DM und Telefon</h3>' + dm + '</div>' +
  '</div>';
}

function zeige() {
  const liste = document.getElementById('liste');
  const sichtbar = D.zeilen.filter(passt);
  const mehrereStaffeln = zustand.staffel === 'alle';
  liste.innerHTML = KAT.map((k) => {
    const z = sichtbar.filter((x) => x.vorverkauf === k.id);
    if (!z.length) return '';
    return '<section><h2>' + esc(k.titel) + ' <span class="n">' + z.length + '</span></h2><p class="was">' + esc(k.was) + '</p>' +
      '<div class="tabelle"><table><thead><tr><th>Punkte</th><th>Verein</th><th class="spalte-grund">Begründung</th><th>E-Mail</th><th class="spalte-insta">Entwürfe</th></tr></thead><tbody>' +
      z.map((x) => {
        const offen = zustand.offen.has(x.slug + x.liga);
        return '<tr class="verein" tabindex="0" aria-expanded="' + offen + '" data-id="' + esc(x.slug + x.liga) + '">' +
          '<td><span class="punkte ' + stufe(x.punkte) + '">' + x.punkte + '</span></td>' +
          '<td><div class="name">' + esc(x.name) + '</div><div class="klein">' + esc(x.ort) + (mehrereStaffeln ? ' · ' + esc(x.ligaName) : '') +
            (x.anbieter ? '<br>' + esc(x.anbieter) : '') + '</div></td>' +
          '<td class="spalte-grund">' + gruendeHtml(x.gruende) + '</td>' +
          '<td>' + kontaktHtml(x) + '</td>' +
          '<td class="spalte-insta">' + (x.mail ? '<span class="tag">Mail</span>' : '') + (x.entwurf ? '<span class="tag grau">DM</span>' : '') + '</td>' +
        '</tr>' + (offen ? '<tr class="detail"><td colspan="5">' + detailHtml(x) + '</td></tr>' : '');
      }).join('') + '</tbody></table></div></section>';
  }).join('') || '<p class="leer">Nichts gefunden.</p>';

  liste.querySelectorAll('tr.verein').forEach((tr) => {
    const umschalten = (ev) => {
      if (ev.target.closest('a')) return;
      const id = tr.dataset.id;
      zustand.offen.has(id) ? zustand.offen.delete(id) : zustand.offen.add(id);
      zeige();
    };
    tr.onclick = umschalten;
    tr.onkeydown = (ev) => { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); umschalten(ev); } };
  });
  liste.querySelectorAll('[data-kopiere]').forEach((b) => {
    b.onclick = async () => {
      const id = b.closest('tr.detail').previousElementSibling.dataset.id;
      const z = D.zeilen.find((x) => x.slug + x.liga === id);
      const text = b.dataset.kopiere === 'mail' ? 'Betreff: ' + z.mail.betreff + '\n\n' + z.mail.text : z.entwurf.replace(/\*\*/g, '');
      try { await navigator.clipboard.writeText(text); b.textContent = 'Kopiert'; } catch { b.textContent = 'Kopieren ging nicht'; }
      setTimeout(() => (b.textContent = b.dataset.kopiere === 'mail' ? 'Mail kopieren' : 'DM kopieren'), 1600);
    };
  });
}

const suche = document.getElementById('suche');
suche.oninput = () => { zustand.suche = suche.value; zeige(); };
for (const id of ['nurMail', 'nurBayern']) {
  const el = document.getElementById(id);
  el.checked = zustand[id];
  el.onchange = () => { zustand[id] = el.checked; merke(); zeige(); };
}
let datenFertig = false;
sportKnoepfe();
staffelKnoepfe();
zeige();

function reiter() {
  const daten = location.hash === '#daten';
  document.getElementById('tab-daten').hidden = !daten;
  document.getElementById('tab-vereine').hidden = daten;
  document.getElementById('r-daten').toggleAttribute('aria-current', daten);
  document.getElementById('r-vereine').toggleAttribute('aria-current', !daten);
  if (daten) document.getElementById('r-daten').setAttribute('aria-current', 'page'); else document.getElementById('r-vereine').setAttribute('aria-current', 'page');
  if (daten && !datenFertig && window.zeigeDaten) { window.zeigeDaten(); datenFertig = true; }
}
window.addEventListener('hashchange', reiter);
window.addEventListener('DOMContentLoaded', reiter);

     in uebersicht.html ein; sie nutzt D, KAT und esc aus dem Hauptskript.

<style>

<div id="tip" role="tooltip"></div>
<script>
(function () {
  const FARBE = { keiner: 'var(--k-keiner)', manuell: 'var(--k-manuell)', keine_angabe: 'var(--k-keine_angabe)', unbekannt: 'var(--k-unbekannt)', anbieter: 'var(--k-anbieter)', eintritt_frei: 'var(--k-eintritt_frei)' };
  const DUNKEL = { unbekannt: true }; // Gelb trägt schwarze Schrift
  const KURZ = { keiner: 'Nur Abendkasse', manuell: 'Von Hand', keine_angabe: 'Keine Angabe', unbekannt: 'Unklar', anbieter: 'Mit Anbieter', eintritt_frei: 'Eintritt frei' };
  const ohneOnline = (z) => z.vorverkauf === 'keiner' || z.vorverkauf === 'manuell';
  const verein = (n) => n + (n === 1 ? ' Verein' : ' Vereine');
  const euro = (p) => (Number.isInteger(p) ? String(p) : p.toFixed(2).replace('.', ',')) + ' €';
  const pct = (a, b) => (b ? Math.round((a / b) * 100) : 0);
  const namen = (l) => l.map((z) => z.name).join(', ');

  // Anbieter auf einen Namen bringen („Vereinsticket (tsg1903…)“ → „Vereinsticket“).
  function anbieterName(a) {
    const s = (a || '').toLowerCase();
    const bekannt = [['vereinsticket', 'Vereinsticket'], ['vivenu', 'vivenu'], ['reservix', 'Reservix'], ['ticket.io', 'ticket.io'], ['ticket i/o', 'ticket.io'],
      ['eventim light', 'Eventim Light'], ['eventim', 'Eventim'], ['leoticket', 'leoticket'], ['ticketleo', 'leoticket'], ['eventfrog', 'Eventfrog'],
      ['vbo', 'VBO Tickets'], ['vibe', 'vibe'], ['tickettune', 'tickettune'], ['wix', 'Wix Events'], ['eigener', 'Eigener Shop'], ['eingebettet', 'Eigener Shop']];
    for (const [k, n] of bekannt) if (s.includes(k)) return n;
    return a ? a.split(/[ (]/)[0] : 'nicht erkennbar';
  }

  // Merkmale, die in der Beobachtung (belegter Satz) stehen; Kontaktwege aus den Feldern.
  const MERKMALE = [
    { t: 'Barzahlung erwähnt', f: (z) => /\bbar\b|barzahlung|bargeld/i.test(z.beobachtung) },
    { t: 'Dauer- oder Saisonkarte', f: (z) => /dauerkarte|saisonkarte/i.test(z.beobachtung) },
    { t: 'Abend- oder Tageskasse', f: (z) => /abendkasse|tageskasse/i.test(z.beobachtung) },
    { t: 'Gruppen oder VIP', f: (z) => /gruppe|vip/i.test(z.beobachtung) },
    { t: 'Ermäßigung, Familie', f: (z) => /ermäßig|familie/i.test(z.beobachtung) },
    { t: 'Instagram vorhanden', f: (z) => !!z.instagram },
    { t: 'E-Mail vorhanden', f: (z) => z.mails.length > 0 },
  ];

  const tip = document.getElementById('tip');
  function zeigeTip(el, ev) {
    tip.innerHTML = el.dataset.tip;
    tip.style.display = 'block';
    const r = el.getBoundingClientRect();
    const x = ev && ev.clientX ? ev.clientX : r.left + r.width / 2;
    const y = ev && ev.clientY ? ev.clientY : r.top;
    const w = tip.offsetWidth, h = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(window.innerWidth - w - 8, x - w / 2)) + 'px';
    tip.style.top = (y - h - 12 < 8 ? y + 18 : y - h - 12) + 'px';
  }
  function verbindeTips(root) {
    root.querySelectorAll('[data-tip]').forEach((el) => {
      el.addEventListener('pointermove', (ev) => zeigeTip(el, ev));
      el.addEventListener('pointerleave', () => (tip.style.display = 'none'));
      el.addEventListener('focus', () => zeigeTip(el));
      el.addEventListener('blur', () => (tip.style.display = 'none'));
    });
  }
  const tipText = (titel, zeilen) => '<b>' + esc(titel) + '</b>' + zeilen.map(esc).join('<br>');

  window.zeigeDaten = function () {
    const root = document.getElementById('tab-daten');
    const alle = D.zeilen.filter(window.imSport);
    const sportarten = [...new Set(alle.map((z) => z.sport))];
    const n = alle.length;
    const kats = KAT.filter((k) => alle.some((z) => z.vorverkauf === k.id));

    // ---- Kacheln
    const kandidaten = alle.filter((z) => z.punkte >= 45).length;
    const kacheln = [
      [alle.filter(ohneOnline).length, n, 'ohne Online-Vorverkauf (nur Abendkasse oder von Hand)'],
      [alle.filter((z) => z.vorverkauf === 'anbieter').length, n, 'verkaufen schon über einen Anbieter'],
      [alle.filter((z) => z.vorverkauf === 'unbekannt' || z.vorverkauf === 'keine_angabe').length, n, 'keine Angabe oder unklar, ein Anruf klärt es'],
      [kandidaten, null, 'Kandidaten ab 45 Punkten'],
    ];

    // ---- Verkaufsweg je Staffel (gestapelt, Anteile)
    // Mehrere Sportarten: je Sportart ein Balken; eine Sportart: je Staffel.
    const gruppen = [{ name: sportarten.length > 1 ? 'Alle Sportarten' : 'Alle Staffeln', l: alle }].concat(
      sportarten.length > 1
        ? sportarten.map((sp) => ({ name: sp, l: alle.filter((z) => z.sport === sp), klein: D.staffeln.filter((s) => s.sport === sp && s.anzahl).length + ' Ligen/Staffeln' }))
        : D.staffeln.filter((s) => s.anzahl && alle.some((z) => z.liga === s.id)).map((s) => ({ name: s.name, l: alle.filter((z) => z.liga === s.id), gesamt: s.gesamt })),
      [{ name: 'Bayern', l: alle.filter((z) => z.land === 'BY'), klein: sportarten.length > 1 ? 'alle Sportarten' : 'alle Staffeln' }, { name: 'Außerhalb Bayerns', l: alle.filter((z) => z.land !== 'BY'), klein: sportarten.length > 1 ? 'alle Sportarten' : 'alle Staffeln' }]
    );
    const stapel = gruppen.map((g) => {
      const segs = kats.map((k) => {
        const l = g.l.filter((z) => z.vorverkauf === k.id);
        if (!l.length) return '';
        const anteil = (l.length / g.l.length) * 100;
        return '<div class="seg' + (DUNKEL[k.id] ? ' dunkeltext' : '') + '" tabindex="0" style="flex:' + l.length + ';background:' + FARBE[k.id] + '" data-tip="' +
          esc(tipText(g.name + ': ' + k.titel, [l.length + ' von ' + g.l.length + ' (' + Math.round(anteil) + ' %)', namen(l)])) + '">' + (anteil >= 9 ? l.length : '') + '</div>';
      }).join('');
      return '<div class="lab">' + esc(g.name) + (g.klein ? '<small>' + esc(g.klein) + '</small>' : g.gesamt ? '<small>' + g.l.length + ' von ' + g.gesamt + ' recherchiert</small>' : '') + '</div>' +
        '<div class="balken">' + segs + '</div><div class="n">' + g.l.length + '</div>';
    }).join('');
    const stapelTabelle = '<table><thead><tr><th>Gruppe</th>' + kats.map((k) => '<th>' + esc(KURZ[k.id]) + '</th>').join('') + '</tr></thead><tbody>' +
      gruppen.map((g) => '<tr><td>' + esc(g.name) + '</td>' + kats.map((k) => '<td>' + g.l.filter((z) => z.vorverkauf === k.id).length + '</td>').join('') + '</tr>').join('') + '</tbody></table>';

    // ---- Anbieter
    const mitAnb = alle.filter((z) => z.vorverkauf === 'anbieter');
    const anb = {};
    for (const z of mitAnb) (anb[anbieterName(z.anbieter)] ??= []).push(z);
    const anbListe = Object.entries(anb).sort((a, b) => b[1].length - a[1].length || a[0].localeCompare(b[0]));
    const maxAnb = Math.max(1, ...anbListe.map((a) => a[1].length));
    const anbHtml = anbListe.map(([name, l]) =>
      '<div class="name">' + esc(name) + '</div><div><div class="zeile"><div class="bar" style="width:' + (l.length / maxAnb) * 85 + '%"></div><span class="wert">' + l.length + '</span></div>' +
      '<div class="wer">' + esc(namen(l)) + '</div></div>').join('');

    // ---- Preise je Verkaufsweg (Punktstreifen)
    const mitPreis = alle.filter((z) => z.preis != null);
    const pKats = kats.filter((k) => mitPreis.some((z) => z.vorverkauf === k.id));
    const W = Math.max(280, Math.min(560, (root.clientWidth || 600) < 700 ? root.clientWidth - 40 : root.clientWidth / 2 - 60)), L = 110, R = 16, ZH = 38, T = 8;
    // Schrittweite nach Spanne, damit sich die Beschriftungen nicht überlappen.
    const roh = Math.max(12, ...mitPreis.map((z) => z.preis));
    const schritt = roh > 40 ? 10 : roh > 16 ? 5 : 2;
    const maxP = Math.ceil(roh / schritt) * schritt;
    const x = (p) => L + (p / maxP) * (W - L - R);
    const H = T + pKats.length * ZH + 24;
    let svg = '<svg class="punkte-svg" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Ticketpreise nach Verkaufsweg">';
    for (let p = 0; p <= maxP; p += schritt) svg += '<line class="achse" x1="' + x(p) + '" x2="' + x(p) + '" y1="' + T + '" y2="' + (H - 20) + '"/><text x="' + x(p) + '" y="' + (H - 6) + '" text-anchor="middle">' + p + ' €</text>';
    pKats.forEach((k, i) => {
      const y = T + i * ZH + ZH / 2;
      const l = mitPreis.filter((z) => z.vorverkauf === k.id).sort((a, b) => a.preis - b.preis);
      svg += '<text x="0" y="' + (y + 4) + '">' + esc(KURZ[k.id]) + ' (' + l.length + ')</text>';
      const med = l.length % 2 ? l[(l.length - 1) / 2].preis : (l[l.length / 2 - 1].preis + l[l.length / 2].preis) / 2;
      svg += '<line class="median" x1="' + x(med) + '" x2="' + x(med) + '" y1="' + (y - 13) + '" y2="' + (y + 13) + '"><title>Median ' + med + ' €</title></line>';
      const belegt = {};
      l.forEach((z) => {
        const k2 = z.preis; const versatz = (belegt[k2] = (belegt[k2] || 0) + 1) - 1;
        svg += '<circle tabindex="0" cx="' + x(z.preis) + '" cy="' + (y + (versatz % 2 ? 1 : -1) * Math.ceil(versatz / 2) * 7) + '" r="5.5" fill="' + FARBE[k.id] + '" data-tip="' +
          esc(tipText(z.name, [euro(z.preis) + ', ' + KURZ[z.vorverkauf] + (z.anbieter ? ' (' + anbieterName(z.anbieter) + ')' : '')])) + '"/>';
      });
    });
    svg += '</svg>';
    const preisTabelle = '<table><thead><tr><th>Verein</th><th>Verkaufsweg</th><th>Preis</th></tr></thead><tbody>' +
      mitPreis.slice().sort((a, b) => b.preis - a.preis).map((z) => '<tr><td>' + esc(z.name) + '</td><td>' + esc(KURZ[z.vorverkauf]) + '</td><td>' + euro(z.preis) + '</td></tr>').join('') + '</tbody></table>';

    // ---- Merkmale × Verkaufsweg (Anteil in der Spalte, einfarbige Stufen)
    const stufe = (a) => (a === 0 ? 0 : a < 0.25 ? 1 : a < 0.45 ? 2 : a < 0.65 ? 3 : a < 0.85 ? 4 : 5);
    const matrix = '<div class="matrix-rahmen"><table class="matrix"><thead><tr><th></th>' + kats.map((k) => '<th>' + esc(KURZ[k.id]) + '<br><small>' + verein(alle.filter((z) => z.vorverkauf === k.id).length) + '</small></th>').join('') + '</tr></thead><tbody>' +
      MERKMALE.map((m) => '<tr><th class="zeilenkopf">' + esc(m.t) + '</th>' + kats.map((k) => {
        const spalte = alle.filter((z) => z.vorverkauf === k.id);
        const l = spalte.filter(m.f);
        const a = spalte.length ? l.length / spalte.length : 0;
        const st = stufe(a);
        return '<td><span class="zelle' + (st ? '' : ' leer0') + '" tabindex="0" style="' + (st ? 'background:var(--seq-' + st + ');color:var(--seq-t-' + st + ')' : '') + '" data-tip="' +
          esc(tipText(m.t + ' · ' + KURZ[k.id], [l.length + ' von ' + spalte.length + ' (' + pct(l.length, spalte.length) + ' %)', l.length ? namen(l) : 'keiner'])) + '">' + l.length + ' <small>' + pct(l.length, spalte.length) + ' %</small></span></td>';
      }).join('') + '</tr>').join('') + '</tbody></table></div>';

    // ---- Muster, aus den Zahlen formuliert
    const muster = [];
    if (sportarten.length > 1) {
      const je = sportarten.map((sp) => { const l = alle.filter((z) => z.sport === sp); return [sp, pct(l.filter(ohneOnline).length, l.length), l.length]; }).sort((a, b) => b[1] - a[1]);
      muster.push('Ohne Online-Vorverkauf nach Sportart: ' + je.map(([sp, p, n]) => '<b>' + esc(sp) + ' ' + p + ' %</b> (' + n + ')').join(', ') + '.');
    }
    const by = alle.filter((z) => z.land === 'BY'), nby = alle.filter((z) => z.land !== 'BY');
    if (by.length && nby.length) muster.push('In Bayern verkaufen <b>' + pct(by.filter(ohneOnline).length, by.length) + ' %</b> nicht online (' + by.filter(ohneOnline).length + ' von ' + by.length + '), außerhalb <b>' + pct(nby.filter(ohneOnline).length, nby.length) + ' %</b> (' + nby.filter(ohneOnline).length + ' von ' + nby.length + ').');
    if (anbListe.length) muster.push('Häufigster Anbieter: <b>' + esc(anbListe[0][0]) + '</b> bei ' + anbListe[0][1].length + ' von ' + mitAnb.length + ' Vereinen mit Online-Verkauf' + (anbListe.length > 1 ? '; insgesamt ' + anbListe.length + ' verschiedene.' : '.'));
    const zweite = alle.filter((z) => /\bII\b/.test(z.name));
    if (zweite.length) muster.push('<b>' + zweite.length + '</b> zweite Mannschaften: ' + zweite.map((z) => esc(z.name) + ' (' + esc(KURZ[z.vorverkauf]) + ')').join(', ') + '. Sie hängen meist am Shop oder Konto der ersten.');
    const ohne = alle.filter(ohneOnline);
    const ohneDk = ohne.filter((z) => /dauerkarte|saisonkarte/i.test(z.beobachtung));
    if (ohne.length) muster.push('Von ' + ohne.length + ' Vereinen ohne Online-Vorverkauf erwähnen <b>' + ohneDk.length + '</b> eine Dauer- oder Saisonkarte' + (ohneDk.length ? ' (' + esc(namen(ohneDk)) + '): der Pass ist dort der zweite Aufhänger.' : '.'));
    const med = (l) => { const s = l.map((z) => z.preis).sort((a, b) => a - b); return s.length ? (s.length % 2 ? s[(s.length - 1) / 2] : (s[s.length / 2 - 1] + s[s.length / 2]) / 2) : null; };
    const mo = med(mitPreis.filter(ohneOnline)), ma = med(mitPreis.filter((z) => z.vorverkauf === 'anbieter'));
    if (mo != null && ma != null) muster.push('Mittlerer Ticketpreis ohne Online-Vorverkauf <b>' + euro(mo) + '</b>, mit Anbieter <b>' + euro(ma) + '</b>. Bei Preisen unter 12 € fällt die Mindestgebühr von 0,99 € stärker ins Gewicht.');
    const unsicher = alle.filter((z) => z.sicherheit === 'niedrig');
    if (unsicher.length) muster.push('<b>' + unsicher.length + '</b> Datensätze haben Sicherheit „niedrig“ und zählen in allen Zahlen hier mit: ' + esc(namen(unsicher)) + '.');

    root.innerHTML =
      '<div class="kacheln">' + kacheln.map(([a, b, t]) => '<div class="kachel"><div class="zahl">' + a + (b ? '<small>von ' + b + '</small>' : '') + '</div><div class="was">' + esc(t) + '</div></div>').join('') + '</div>' +
      '<div class="panel"><h2>Wie verkaufen die Vereine?</h2><p class="frage">Verkaufsweg je Staffel und Region, als Anteil. Fahr über eine Fläche für die Namen.</p>' +
        '<div class="legende">' + kats.map((k) => '<span><i style="background:' + FARBE[k.id] + '"></i>' + esc(KURZ[k.id]) + '</span>').join('') + '</div>' +
        '<div class="stapel">' + stapel + '</div><details class="tab"><summary>Als Tabelle</summary>' + stapelTabelle + '</details></div>' +
      '<div class="zwei">' +
        '<div class="panel"><h2>Welche Anbieter?</h2><p class="frage">Nur Vereine, die schon online verkaufen (' + mitAnb.length + ').</p><div class="anb">' + (anbHtml || '<p class="leer">keine</p>') + '</div></div>' +
        '<div class="panel"><h2>Was kostet ein Ticket?</h2><p class="frage">Erwachsenenpreis, wo belegt (' + mitPreis.length + ' von ' + n + '). Strich = Median.</p>' + svg +
          '<details class="tab"><summary>Als Tabelle</summary>' + preisTabelle + '</details></div>' +
      '</div>' +
      '<div class="panel" style="margin-top:18px"><h2>Was steht dabei?</h2><p class="frage">Anteil je Verkaufsweg. Die ersten fünf Zeilen aus dem belegten Beobachtungssatz, die letzten zwei aus den Kontaktfeldern. Kräftiger heißt häufiger.</p>' + matrix + '</div>' +
      '<div class="panel"><h2>Muster</h2><ul class="muster">' + muster.map((m) => '<li>' + m + '</li>').join('') + '</ul>' +
        '<p class="vorsicht">Bei ' + n + ' Vereinen sind das Hinweise, keine Statistik. Jede weitere Staffel macht die Muster belastbarer.</p></div>';
    verbindeTips(root);
  };
})();
</script>

</body>
</html>
